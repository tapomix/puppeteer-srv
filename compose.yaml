services:
  puppeteer:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: puppeteer-srv
    image: tapomix/puppeteer-srv
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://puppeteer:${SERVER_PORT}/health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - puppeteer-net
    # sites call http://puppeteer:63001: on their own network, `puppeteer` is an alias of Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=puppeteer" # network name, not the compose key
      - "traefik.http.routers.puppeteer.rule=Host(`puppeteer`)"
      - "traefik.http.routers.puppeteer.entrypoints=puppeteer" # internal entrypoint, never published on the host
      - "traefik.http.services.puppeteer.loadbalancer.server.port=${SERVER_PORT}"

networks:
  puppeteer-net:
    name: puppeteer
